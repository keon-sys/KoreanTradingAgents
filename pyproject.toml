[project]
name = "krta"
version = "0.1.0"
description = "KoreanTradingAgents: LLM multi-agent analyzer for Korean stocks (KOSPI/KOSDAQ)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "langgraph",
    "langchain-anthropic",
    "langchain-core",
    "pydantic>=2",
    "requests",
    "pandas",
    "yfinance",
    "exchange_calendars",
]

[project.scripts]
krta = "krta.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-socket",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krta"]

[tool.pytest.ini_options]
addopts = "--disable-socket"
testpaths = ["tests"]
